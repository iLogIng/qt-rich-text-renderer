# rich-text-renderer settings template
#
# This file is the read-only default template bundled with the application.
# User changes are stored separately through QSettings and override the values
# below. Restart or reopen the Settings dialog after editing values manually.
#
# Font sizes are in points. Timeouts are in milliseconds.

[meta]
# Schema version reserved for future migrations.
version=1

[appearance]
# Theme: light or dark.
theme=light
# Application and preview font size, 8-18 points.
uiFontPointSize=10
# Read-only Markdown source font size, 8-24 points.
sourceFontPointSize=10
# Color Markdown syntax in the read-only Source tab.
sourceHighlighting=true

[view]
# Show the left document outline dock.
outlineVisible=true
# Show the read-only Source tab.
sourceVisible=true

[preview]
# Maximum rendered MathJax/Mermaid SVG width in pixels, 320-2000.
maxSvgWidth=860

[renderer]
# Renderer worker idle shutdown timeout, 1000-3600000 ms.
idleTimeoutMs=60000
# MathJax request timeout, 1000-300000 ms.
mathRequestTimeoutMs=10000
# Mermaid request timeout, 1000-300000 ms.
mermaidRequestTimeoutMs=15000

[files]
# Last directory used by the Load file chooser.
lastDirectory=

[window]
# Encoded QMainWindow geometry. Empty means use the built-in default size.
geometry=
